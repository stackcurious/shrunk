name = "shrunk-api"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *", "0 13 * * 1"]

[vars]
ENV = "dev"
KROGER_PERSIST = "on"
PUSH_PROVIDER = "apns"
APNS_ENV = "production"   # TestFlight and App Store builds carry production APNs tokens; use "sandbox" only for Xcode debug builds
# TestFlight period — flip to "Production" at App Store release (see RELEASE_CHECKLIST)
APPSTORE_ALLOWED_ENVIRONMENTS = "Sandbox,Production"

[[d1_databases]]
binding = "DB"
database_name = "shrunk"
database_id = "ab56af73-6f6c-459f-af81-459eee5ba8bd"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "shrunk-photos"

[[kv_namespaces]]
binding = "KV"
id = "8946e07db9bc4563b37fbff86a467dfe"
